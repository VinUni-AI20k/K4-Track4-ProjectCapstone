name: CI/CD Pipeline - Perception & Capstone Test Suite

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  code-quality-and-security:
    name: Code Quality, Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit ruff

      - name: Syntax & Lint Check (Ruff / Flake8)
        run: |
          # Dừng build nếu có lỗi syntax hoặc biến chưa khai báo
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Cảnh báo phong cách code PEP8
          flake8 modules tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Python Security Audit (Bandit)
        run: |
          # Quét lỗ hổng bảo mật: eval/exec, hardcoded secrets, unsafe deserialization
          bandit -r modules -ll -ii

  test-suite:
    name: Automated Unit & Interface Contract Tests
    needs: code-quality-and-security
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System OpenCV Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest with Interface Contract Checks
        run: |
          pytest tests/test_detector.py --tb=short -v
